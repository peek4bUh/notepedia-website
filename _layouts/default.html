<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{{ page.title }} | {{ site.title }}</title>
		<link rel="icon" href="/assets/icons/logo.svg">
		<link rel="stylesheet" href="/assets/css/styles.css">
	</head>

	<body class="page-default">
		{% include header.html %}
		<div class="page-default__container">
			<aside class="page-default__sidebar-left" id="left-sidebar">
				<div class="page-default__sidebar-left-inner">
					{% include navigation.html %}
				</div>
			</aside>

			<div class="page-default__wrapper">
				<div class="page-default__content">
					{{ content }}
				</div>

				<aside class="page-default__sidebar-right" id="right-sidebar">
					<div class="page-default__sidebar-right-inner">
						<h2 class="content-toc__title">Table of Contents</h2>
						{% include toc.html html=content class="page-default-toc__list" id="toc"%}
					</div>
				</aside>
			</div>
		</div>
	</body>
	<script src="/assets/js/hamburger.js"></script>
	<script src="/assets/js/toc.js"></script> 
</html>
