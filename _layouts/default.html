<!doctype html>
<html lang="en">
	{% include head.html %}

	<body class="default" id="page-note">
		{% include header.html %}

		<div class="default__wrapper">
			<div class="default__container">
				{% include navigation.html %}

				<div class="default__frame">
					<div class="default__content">
						{{ content }}
					</div>

					<aside class="sidebar sidebar--right" id="right-sidebar">
						<div class="sidebar__inner sidebar__inner--right">
							{% include sublinks.html name="context" %}
							{% include sublinks.html name="related" %}
							{% include sublinks.html name="see-also" %}
							{% include toc.html %}
						</div>
					</aside>
				</div>

				<button class="toc-btn" id="toc-btn">
					<img class="toc-btn__img" src="/assets/icons/toc.svg" alt="Toc Icon">
				</button>
			</div>
		</div>
	</body>
	<script src="/assets/js/hamburger.js"></script>
	<script src="/assets/js/toc.js"></script>
</html>
