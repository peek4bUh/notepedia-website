<!doctype html>
<html lang="en">
	{% include head.html %}

	<body class="page-note" id="page-note">
		{% include header.html title="Notes" %}

		<div class="page-note__wrapper">
			<div class="page-note__container">
				<aside class="navigation" id="left-sidebar">
					<div class="navigation__wrapper">
						<ul class="navigation__list">
							{% assign sorted_notes = site.notes | sort: "title" %}
							{% for item in sorted_notes %}
							<li class="navigation__item">
								<a class="navigation__link" href="{{ item.url }}">{{ item.title }}</a>
							</li>
							{% endfor %}
						</ul>
					</div>
				</aside>

				<div class="page-note__frame">
					<div class="page-note__content">
						{{ content }}
					</div>

					<aside class="sidebar sidebar--right" id="right-sidebar">
						<div class="sidebar__inner sidebar__inner--right">
							{% include toc.html %}
						</div>
					</aside>
				</div>

				<button class="toc-btn" id="toc-btn">
					<img class="toc-btn__img" src="/assets/icons/toc.svg" alt="Toc Icon">
				</button>
			</div>
		</div>
	</body>
	<script src="/assets/js/hamburger.js"></script>
	<script src="/assets/js/toc.js"></script>
</html>
