<ul class="navigation">
  {% assign sorted_notes = site.notes | sort: "title" %}
  {% for item in sorted_notes %}
    <li class="navigation__item">
      <a 
        class="navigation__link{% if page.url == item.url %} current{% endif %}" 
        href="{{ item.url }}">
        {{ item.title }}
      </a>
    </li>
  {% endfor %}
</ul>
