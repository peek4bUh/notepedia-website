{% if include.type == "corner" %}
<div class="corner-toggle" id="themeBtn">
	<div class="toggle-text" id="test">Dark</div>
</div>
{% elsif include.type == "select" %}
<select id="themeBtn" class="theme-select" onclick="initDarkMode()" aria-label="Select theme">
	<option value="System">System</option>
	<option value="light">Light</option>
	<option value="dark">Dark</option>
</select>
{% endif %}
